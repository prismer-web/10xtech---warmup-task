<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Awesome Team</title>

    <!-- Montserrat Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="team-section">

        <div class="container">

            <!-- Hero Section -->
            <header class="hero">

                <h1>Our Awesome Team</h1>

                <p>
                    We have created a new product that will help designers, developers and
                    <br class="desktop-break">
                    companies create websites for their startups quickly and easily.
                </p>

                <a href="#team" class="team-button">
                    Enjoy Our Team
                </a>

            </header>


            <!-- Team Section -->
            <section class="team-grid" id="team">

                <!-- Vanessa -->
                <article class="team-card">

                    <div class="member">

                        <img
                            src="assets/vanessa.jpg"
                            alt="Vanessa Laird"
                        >

                        <h2>Vanessa Laird</h2>

                        <p class="role">
                            UI DESIGNER
                        </p>

                    </div>


                    <div class="socials">

                        <a href="#" aria-label="Twitter">
                            <i class="fa-brands fa-twitter"></i>
                        </a>

                        <a href="#" aria-label="Facebook">
                            <i class="fa-brands fa-facebook-square"></i>
                        </a>

                        <a href="#" aria-label="Dribbble">
                            <i class="fa-brands fa-dribbble"></i>
                        </a>

                    </div>

                </article>


                <!-- Mason -->
                <article class="team-card">

                    <div class="member">

                        <img
                            src="assets/mason.jpg"
                            alt="Mason Campbell"
                        >

                        <h2>Mason Campbell</h2>

                        <p class="role">
                            UI DESIGNER
                        </p>

                    </div>


                    <div class="socials">

                        <a href="#" aria-label="Twitter">
                            <i class="fa-brands fa-twitter"></i>
                        </a>

                        <a href="#" aria-label="Facebook">
                            <i class="fa-brands fa-facebook-square"></i>
                        </a>

                        <a href="#" aria-label="Dribbble">
                            <i class="fa-brands fa-dribbble"></i>
                        </a>

                    </div>

                </article>


                <!-- Irea -->
                <article class="team-card">

                    <div class="member">

                        <img
                            src="assets/irea.jpg"
                            alt="Irea Evans"
                        >

                        <h2>Irea Evans</h2>

                        <p class="role">
                            CLIENT MANAGER
                        </p>

                    </div>


                    <div class="socials">

                        <a href="#" aria-label="Twitter">
                            <i class="fa-brands fa-twitter"></i>
                        </a>

                        <a href="#" aria-label="Facebook">
                            <i class="fa-brands fa-facebook-square"></i>
                        </a>

                        <a href="#" aria-label="Dribbble">
                            <i class="fa-brands fa-dribbble"></i>
                        </a>

                    </div>

                </article>

            </section>

        </div>

    </main>

</body>
</html>
